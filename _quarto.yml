# GitHub Pages serves the main branch as it is, so the site renders in place:
# each page's .html sits next to its .qmd. Run `quarto render` and commit the result.
project:
  type: website
  output-dir: .
  render:
    - index.qmd
    - schedule.qmd
    - assessment.qmd
    - assignments/index.qmd
    - assignments/1.qmd
    - assignments/2.qmd
    - assignments/3.qmd
    - assignments/4.qmd
    - projects/index.qmd
    - calendar/index.qmd
    - schedule/index.qmd
    - staff/index.qmd
    - announcements/index.qmd

website:
  title: "CS 691 · Probabilistic Machine Learning 2022"
  favicon: favicon.svg
  description: "Probabilistic Machine Learning at IIT Gandhinagar, August–November 2022"
  site-url: https://nipunbatra.github.io/pml2022/
  search: false

format:
  html:
    theme: [cosmo, styles.scss, course.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    body-classes: dl
    link-external-newwindow: true
    include-in-header: course-theme.html
    include-before-body: rail.html
    include-after-body: course-tools.html
